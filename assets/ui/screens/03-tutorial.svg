<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><filter id="sat50"><feColorMatrix type="saturate" values="0.5"/></filter><linearGradient id="surface" x2="0" y2="1"><stop stop-color="#142b3d" stop-opacity=".94"/><stop offset="1" stop-color="#06111f" stop-opacity=".94"/></linearGradient></defs><path fill="#050d19" d="M0 0H1920V1080H0Z"/><text x="70" y="80" fill="#66ddec" font-size="26" text-anchor="start" font-family="PingFang SC,Arial,sans-serif">轨道使命 / ORBIT MISSION</text><text x="1840" y="80" fill="#87a8ba" font-size="19" text-anchor="end" font-family="PingFang SC,Arial,sans-serif">首次操作指引 / FLIGHT BRIEFING</text><path d="M268 220H1638L1670 252V822L1652 840H282L250 808V238Z" fill="url(#surface)" stroke="#66ddec" stroke-width="1"/><path d="M276 227H335M1663 259V305M1645 833H1585" stroke="#66ddec" stroke-width="3"/><text x="310" y="285" fill="#e9f7ff" font-size="38" text-anchor="start" font-family="PingFang SC,Arial,sans-serif">操作指引</text><text x="320" y="380" fill="#ffbf63" font-size="40" text-anchor="start" font-family="PingFang SC,Arial,sans-serif">01</text><text x="440" y="380" fill="#e9f7ff" font-size="28" text-anchor="start" font-family="PingFang SC,Arial,sans-serif">注视行星 2 秒，或用手柄射线指向后按确认键。</text><text x="320" y="515" fill="#ffbf63" font-size="40" text-anchor="start" font-family="PingFang SC,Arial,sans-serif">02</text><text x="440" y="515" fill="#e9f7ff" font-size="28" text-anchor="start" font-family="PingFang SC,Arial,sans-serif">用手柄射线抓取火箭，调整位置和朝向，松手开始飞行。</text><text x="320" y="650" fill="#ffbf63" font-size="40" text-anchor="start" font-family="PingFang SC,Arial,sans-serif">03</text><text x="440" y="650" fill="#e9f7ff" font-size="28" text-anchor="start" font-family="PingFang SC,Arial,sans-serif">按住扳机持续加速。完成稳定环绕一圈，即可达成任务。</text><path d="M1278 745H1528L1560 777V783L1542 801H1292L1260 769V763Z" fill="url(#surface)" stroke="#66ddec" stroke-width="1"/><path d="M1286 752H1345M1553 784V791M1535 794H1475" stroke="#66ddec" stroke-width="3"/><text x="1410.0" y="780" fill="#66ddec" font-size="18" text-anchor="middle" font-family="PingFang SC,Arial,sans-serif">开始任务</text><path d="M328 745H538L570 777V783L552 801H342L310 769V763Z" fill="url(#surface)" stroke="#66ddec" stroke-width="1"/><path d="M336 752H395M563 784V791M545 794H485" stroke="#66ddec" stroke-width="3"/><text x="440.0" y="780" fill="#66ddec" font-size="18" text-anchor="middle" font-family="PingFang SC,Arial,sans-serif">跳过教程</text></svg>